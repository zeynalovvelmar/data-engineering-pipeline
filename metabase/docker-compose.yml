services:
  metabase:
    image: metabase/metabase:latest
    container_name: de_metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - "3000:3000"
    restart: always
    networks:
      - data_pipeline_net

networks:
  data_pipeline_net:
    external: true
